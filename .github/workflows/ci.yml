# Continuous Integration — runs on every pull request and on pushes to main.
# Validates BOTH parts of the repo independently:
#   - web/       the Next.js-on-Cloudflare backend (Vitest/Miniflare + typecheck)
#   - extension  the VS Code extension at the repo root (node:test + tsc + esbuild build)
#
# This workflow needs NO secrets — it only builds and tests. Deployment is a
# separate workflow (deploy.yml) that runs after code lands on main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: web backend — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (Vitest / Miniflare)
        run: npm test

  extension:
    name: extension — typecheck, build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build (esbuild)
        run: npm run build
      - name: Tests (node:test)
        run: npm test
