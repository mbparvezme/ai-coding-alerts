# Cloudflare Worker config for the AI Coding Alerts licensing backend.
# Design: ../docs/superpowers/specs/2026-07-22-licensing-backend-design.md

name = "ai-coding-alerts"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# D1 database. Create it once with:  wrangler d1 create ai-coding-alerts
# then paste the returned id below.
[[d1_databases]]
binding = "DB"
database_name = "ai-coding-alerts"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Secrets (never commit values). Set with:
#   wrangler secret put PADDLE_WEBHOOK_SECRET
#   wrangler secret put LICENSE_SIGNING_PRIVATE_KEY
# For local dev, put them in .dev.vars (gitignored) — see .dev.vars.example.
